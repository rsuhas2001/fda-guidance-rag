version: "3.9"
services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pharma_user
      POSTGRES_PASSWORD: pharma_password
      POSTGRES_DB: pharma_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pharma-rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pharma_user:pharma_password@pgvector-db:5432/pharma_rag
      LLM_PROVIDER: local_extractive
    depends_on:
      - pgvector-db

volumes:
  pgdata:
